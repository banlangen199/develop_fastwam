# @package _global_
#
# RoutedWAM with regression Dream on LIBERO-10. Four GPUs give an effective batch of
# 32 per GPU * 4 GPUs * 1 accumulation step = 128.
# The data config supplies 32 actions and Dream targets at offsets [16, 32].

defaults:
  - override /data: libero_10_2cam
  - override /model: routed_wam
  - _self_

output_dir: ./runs/routed_wam_libero_10/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: ./checkpoints/libero_uncond_2cam224_100m.pt
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  # Freeze pretrained Video; jointly train Dream, Action and the PR #2 Router.
  training_mode: dense_joint
  finetune_action_only: false
  generative_dream:
    enabled: false
  router:
    mode: learned
    routing_mode: null
    lambda_budget: 0.01
  interface_distill:
    enabled: false
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_dream: 0.1
