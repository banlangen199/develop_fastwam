# @package _global_

defaults:
  - override /data: libero_object_2cam
  - override /model: dream_fastwam
  - _self_

output_dir: ./runs/dream_fastwam_libero_object/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 16
num_workers: 8
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 3
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_dream: 0.1

