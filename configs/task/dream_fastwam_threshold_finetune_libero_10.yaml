# @package _global_

defaults:
  - override /data: libero_10_2cam
  - override /model: dream_fastwam_action_threshold
  - _self_

output_dir: ./runs/dream_fastwam_threshold_finetune_libero_10/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 16
num_workers: 4
lr_scheduler_type: cosine
learning_rate: 1.0e-5
num_epochs: 2
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
freeze_video_expert: true

model:
  finetune_action_only: true
  mot_checkpoint_mixed_attn: true
  action_dream_threshold:
    enabled: true
    alpha: 1.0
    warmup_ratio: 0.1
    head_reduce: mean
    action_query_reduce: max
    min_keep_dream_tokens: 0
    detach_selection_score: true
    log_statistics: true
    save_detailed_tensors: false
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_dream: 0.0

