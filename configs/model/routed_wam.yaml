defaults:
  - dream_fastwam
  - _self_

_target_: fastwam.routed_runtime.create_routed_wam

# ---------------------------------------------------------------- generative
# Dream directly regresses future targets in one forward, without Dream noise.
# Generative Dream remains available only for explicitly selected legacy tasks.
generative_dream:
  enabled: false
  freq_dim: 256

# Used only when generative_dream.enabled=true; unused by direct regression.
dream_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  inference_steps: 1

# ------------------------------------------------------------------- router
router:
  mode: learned
  routing_mode: null
  gate_type: bilinear  # PR #2: Action-query / Dream-key token gates.
  rank: 64
  temperature: 1.0
  # sigmoid(4) ~ 0.982, so routing starts as a near-identity and has to learn
  # what to switch off rather than what to switch on.
  bias_init: 4.0
  # Buckets used for the budget bias, the training-log breakdown and the
  # stage-dependent-perception figure. `_camera` splits each block into its
  # primary and wrist halves (dream_query.camera_token_split), which is what
  # makes "global semantics early, wrist geometry near contact" measurable.
  # Options: none | modality | modality_horizon | modality_camera |
  #          modality_horizon_camera
  group_granularity: modality_horizon_camera
  alpha: 1.0
  min_keep_tokens: 0
  target_keep_ratio: 0.25
  lambda_budget: 0.01
  gate_threshold: 1.0e-3
  hard_prune_at_inference: true
  warmup_ratio: 0.1
  log_statistics: true
  debug_force_gate: null
  layers: null
  # Explicit compatibility settings for the earlier QK-routing ablations.
  router_enabled: true
  router_warmup_steps: 0
  router_hidden_dim: 128
  router_gate_loss_weight: 0.0


# -------------------------------------------------------- interface distill
# Compress the multi-step Dream rollout into one forward, supervising the
# per-layer Dream K/V that the action expert actually reads.
# Requires generative_dream.enabled=true and freeze_video_expert=true.
interface_distill:
  enabled: false
  teacher_steps: 8
  student_steps: 1
  ema_decay: 0.995
  layers: null
  lambda_k: 1.0
  lambda_v: 1.0
  lambda_total: 1.0
  route_aware: true
  warmup_ratio: 0.1
  detach_teacher: true

finetune_action_only: false
training_mode: dense_joint
