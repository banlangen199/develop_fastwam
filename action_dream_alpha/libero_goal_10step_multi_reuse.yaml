checkpoint: runs/dream_fastwam_libero_goal/2026-08-03_09-01-44_8756/checkpoints/weights/step_001656.pt
dataset_stats_path: runs/dream_fastwam_libero_goal/2026-08-03_09-01-44_8756/dataset_stats.json
hydra_task: dream_fastwam_libero_goal
output_dir: action_dream_alpha/outputs/libero_goal_10step_multi_reuse_step_001656_seed42
device: cuda
seed: 42
tiled: false

calibration:
  episode_ratio: 0.1
  max_episodes_per_task: 5
  observations_per_episode: 8

profile:
  num_inference_steps: 10
  # Multi-anchor reuse must be measured at every actual inference step.
  diffusion_step_indices: all
  attention_layers: all

# Keep the old sweep values for comparison and add the currently used alpha.
paired_loss:
  noise_repeats: 3
alpha_values: [0.0, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5]

selection:
  min_mass_retention: 0.95
  max_relative_action_loss_delta: 0.01
  objective: min_mean_k
  k_zero_ratio_used_for_selection: false

first_step_reuse_analysis:
  enabled: true
  anchor_step_index: 0
  report_alphas: [0.2, 0.25, 0.5]
  selection:
    min_later_token_recall: 0.95
    min_fixed_mass_retention: 0.90
    max_relative_action_loss_delta: 0.01

multi_step_reuse_analysis:
  enabled: true
  # The first entry is the baseline; subsequent entries refresh after 5 or 3 steps.
  anchor_step_schedules: [[0], [0, 5], [0, 3, 6]]
